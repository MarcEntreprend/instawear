<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index,follow" />
    <meta name="theme-color" content="#ff5c35" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <link rel="alternate" hreflang="en" href="https://instawear.vercel.app/" />
    <link rel="alternate" hreflang="fr" href="https://instawear.vercel.app/fr" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- SEO Primary -->
    <title>InstaWear — Wear the Moment</title>
    <meta
      name="description"
      content="InstaWear, the print-on-demand shop celebrating the biggest events: Champions League, Rio Carnival, Oktoberfest, Halloween. Organic cotton, AI designs, 3–7 day delivery."
    />
    <link rel="canonical" href="https://instawear.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="InstaWear" />
    <meta property="og:title" content="InstaWear — Wear the Moment" />
    <meta property="og:description" content="Print-on-demand for every major event. Exclusive AI designs, organic cotton, express delivery." />
    <meta property="og:image" content="https://instawear.vercel.app/InstaWear-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="InstaWear logo" />
    <meta property="og:url" content="https://instawear.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="InstaWear — Wear the Moment" />
    <meta name="twitter:description" content="Event print-on-demand. UCL, Rio Carnival, Oktoberfest, Halloween. Express delivery." />
    <meta name="twitter:image" content="https://instawear.vercel.app/InstaWear-logo.png" />

    <!-- Schema.org Organization + WebSite SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "InstaWear",
        "url": "https://instawear.vercel.app/",
        "logo": "https://instawear.vercel.app/InstaWear-logo.png",
        "description": "Print-on-demand clothing store for global events",
        "contactPoint": {
          "@type": "ContactPoint",
          "contactType": "customer service",
          "availableLanguage": ["English", "French"]
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://instawear.vercel.app/",
        "name": "InstaWear",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://instawear.vercel.app/recherche?q={search_term_string}",
          "query-input": "required name=search_term_string"
        }
      }
    </script>

    <!-- Favicon / Apple Touch Icon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/InstaWear-logo-wh-middle-no-BG.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/InstaWear-logo-wh-middle-no-BG.png"
    />
    <link rel="apple-touch-icon" href="/InstaWear-logo-wh-middle-no-BG.png" />
    <meta
      name="msapplication-TileImage"
      content="/InstaWear-logo-wh-middle-no-BG.png"
    />

    <script>try{history.scrollRestoration='manual';}catch(e){}</script>
    <!-- Google Fonts: Plus Jakarta Sans + DM Serif Display + JetBrains Mono -->

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap"

    />
