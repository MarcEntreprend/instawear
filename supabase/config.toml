
[functions.sync-printful]
enabled = true
verify_jwt = false
import_map = "./functions/sync-printful/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/sync-printful/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/sync-printful/*.html" ]

# Gel audit sécurité (Bloc 2) : flags verify_jwt figés tels que déployés le
# 13/09/2026 (vérifiés via `functions list`). Règle : false partout SAUF
# interaction-notify (JWT propriétaire exigé de toute façon). Ces flags
# vivent côté dashboard et sont invisibles au repo : toute dérive se voit
# ici en diff. Changer un flag = décision consciente (ex. passer
# stripe-webhook à true tuerait les paiements en silence).
# Chaque edge applique SA propre auth (signatures, secrets, JWT admin) —
# verify_jwt=false n'est donc pas une ouverture, c'est le pré-requis des
# webhooks Stripe/Printful et des flux invités.
[functions.approve-printful-design]
enabled = true
verify_jwt = false

